services:
  proxy:
    build: ./proxy
    restart: unless-stopped
    env_file:
      - ./proxy/.env
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://thilsc.github.io}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./proxy/cookies.txt:/app/cookies.txt:ro
    ports:
      - "5000:5000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - proxy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
